[project]
name = "wxreply"
version = "0.1.0"
description = "微信辅助回复助手：基于已解密聊天记录（知识库）生成多风格候选回复，Windows 桌面端"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pycryptodome>=3.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wxreply = "wxreply.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wxreply*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
